<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>책상 위 공부방</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2520;--paper:#fbf7ec;--line:#ddd2b8;--en:#2d5a94;--ma:#2a7560;--sc:#9a4046;--hl:#ffe45e}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Special Elite','Nanum Gothic Coding',monospace;color:var(--ink);overflow:hidden;background:#3b2417;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font-family:inherit}
#desk{position:fixed;inset:0;background:radial-gradient(110% 80% at 50% 30%,rgba(255,225,175,.4),transparent 62%),radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.45)),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),linear-gradient(170deg,#a77450,#5f3a26 70%,#40251a)}
.sta{position:absolute;inset:0;width:100%;height:100%}.sta g,.sta circle{filter:drop-shadow(3px 6px 3px rgba(0,0,0,.45))}
#shelf{position:absolute;left:46%;top:52%;transform:translate(-50%,-50%);display:flex;gap:clamp(10px,3vw,40px);align-items:flex-end}
.bk{width:clamp(86px,19vw,180px);aspect-ratio:3/4;border:0;border-radius:3px 10px 10px 3px;color:#fff;cursor:pointer;position:relative;text-align:left;background:linear-gradient(135deg,var(--c2),var(--c1) 55%,var(--c3));box-shadow:1px 0 0 #f4ecd8,3px 0 0 #d8ceb2,5px 0 0 #f4ecd8,7px 0 0 #c9bb98,16px 20px 26px rgba(0,0,0,.55),inset 9px 0 8px -6px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .25s}
.bk:nth-child(1){transform:rotate(-4deg)}.bk:nth-child(2){transform:rotate(1.5deg) translateY(-8px)}.bk:nth-child(3){transform:rotate(5deg)}
.bk:hover,.bk:focus-visible{transform:translateY(-14px) rotate(0);outline:none}
.bk::before{content:"";position:absolute;inset:12px 12px 12px 22px;border:1.5px solid rgba(255,255,255,.5);border-radius:2px}
.bk span{position:relative;display:block;padding:34% 10px 0 26px;font:700 clamp(18px,3.6vw,30px) 'Special Elite','Nanum Gothic Coding',monospace;text-shadow:0 2px 3px rgba(0,0,0,.35)}
.bk i{display:block;font:400 .5em 'Special Elite',monospace;opacity:.85;margin-top:8px}
#clk{position:absolute;right:max(3vw,10px);bottom:7vh;width:clamp(130px,17vw,190px);transform:rotate(-3deg)}
#clk .top{display:flex;justify-content:space-between;padding:0 14px}#clk .top i{width:44%;height:18px;border-radius:50% 50% 0 0;background:linear-gradient(#e8d9a8,#a8913f);box-shadow:0 3px 3px rgba(0,0,0,.4)}
#clk .face{background:linear-gradient(160deg,#4a4f58,#23262c);border-radius:18px 18px 10px 10px;padding:10px;box-shadow:inset 0 2px 2px rgba(255,255,255,.25),0 14px 20px rgba(0,0,0,.55),0 0 0 3px #b9a35a}
#clk .scr{background:#10241b;border-radius:8px;padding:10px 6px;text-align:center;box-shadow:inset 0 3px 8px #000}
#tm{display:block;color:#7dffb2;font-size:clamp(17px,2.4vw,26px);letter-spacing:.04em;text-shadow:0 0 8px #3cff91}
#dt{display:block;color:#5fc88b;font-size:11px;margin-top:4px;font-family:'Nanum Gothic Coding',monospace}
#clk .lg{display:flex;justify-content:space-between;padding:0 18px}#clk .lg i{width:12px;height:10px;background:#7a6422;border-radius:0 0 4px 4px}
#st{position:fixed;inset:0;background:rgba(10,7,5,.8);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .5s;z-index:5}
#st.on{display:flex}#st.vis{opacity:1}
#bk{position:relative;width:min(96vw,1020px);height:min(84vh,660px);perspective:2400px;transform:scale(.45) translateY(60px) rotate(-3deg);transition:transform .75s cubic-bezier(.2,.85,.25,1)}
#st.vis #bk{transform:none}
#bk.en{--cc:linear-gradient(135deg,#4a7cbc,#27466f);font-family:'Special Elite','Nanum Gothic Coding',monospace}
#bk.ma{--cc:linear-gradient(135deg,#46a085,#1d4f40);font-family:'Special Elite','Nanum Gothic Coding',monospace}
#bk.sc{--cc:linear-gradient(135deg,#c4666b,#6a2a2f);font-family:'Nanum Pen Script',cursive;font-size:23px}
.cv{position:absolute;inset:-12px;border-radius:12px;background:var(--cc);box-shadow:0 35px 80px rgba(0,0,0,.7),inset 0 0 0 2px rgba(255,255,255,.14)}
.pgs{position:absolute;inset:0;display:flex}
.pgs::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:36px;margin-left:-18px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.3),transparent);z-index:6;pointer-events:none}
.pp{overflow:auto;padding:32px 36px}
#L,#R{position:relative;flex:1}
.pp.l{background:linear-gradient(90deg,#f3ecd8,#fcf8ec 10%,#fcf8ec 90%,#e4dac0);border-radius:6px 0 0 6px;box-shadow:inset 2px 0 0 #fff8}
.pp.r{background:linear-gradient(90deg,#e4dac0,#fcf8ec 10%,#fcf8ec 90%,#f3ecd8);border-radius:0 6px 6px 0}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:4;pointer-events:none}
.leaf.f{left:50%;transform-origin:left center;animation:ff var(--d,.8s) cubic-bezier(.45,.05,.25,1) forwards}
.leaf.b{left:0;transform-origin:right center;animation:bb var(--d,.8s) cubic-bezier(.45,.05,.25,1) forwards}
.leaf .pp{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.leaf .bk2{transform:rotateY(180deg)}
@keyframes ff{0%{transform:rotateY(0) translateZ(0)}50%{transform:rotateY(-90deg) translateZ(30px)}100%{transform:rotateY(-180deg)}}
@keyframes bb{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) translateZ(30px)}100%{transform:rotateY(180deg)}}
#x{position:absolute;top:-30px;right:-20px;z-index:8;width:38px;height:38px;border-radius:50%;border:0;background:#f6ead6;color:var(--ink);font-size:18px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.nv{position:absolute;bottom:14px;z-index:8;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(43,37,32,.5);background:rgba(255,255,255,.7);color:var(--ink);font-size:15px;cursor:pointer}
#pv{left:20px}#nx{right:20px}.nv:hover{background:#fff}
button:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
.ttl{font-size:clamp(20px,3vw,27px);font-weight:700;margin-bottom:6px}
.sub{font-size:13px;opacity:.65;margin-bottom:16px}
#bk.sc .sub{font-size:19px}
#intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4vw,38px);font-weight:700;transition:all .9s cubic-bezier(.6,0,.3,1);pointer-events:none}
#intro.up{inset:26px 0 auto;font-size:19px;height:30px;opacity:.7}
.lst{margin-top:70px;line-height:2.1;font-size:15px}.lst b{color:var(--en)}
.no{font-size:12px;opacity:.6;letter-spacing:.1em;text-transform:uppercase}
.wd{font-size:clamp(32px,5vw,50px);font-weight:700;text-align:center;margin:44px 0 8px;animation:pop .6s both}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.pr{display:flex;gap:12px;justify-content:center;align-items:center;color:#555;margin-bottom:20px;flex-wrap:wrap}
.snd{border:1.5px solid var(--en);color:var(--en);background:#fff;border-radius:20px;padding:5px 14px;font-weight:700;font-size:13px;cursor:pointer}
.snd:hover{background:var(--en);color:#fff}
.ent{border-top:1.5px solid var(--ink);padding:14px 0;line-height:1.7}
.ent b{color:var(--en)}.ex{border-left:3px solid var(--en);padding-left:12px;margin-top:8px;background:rgba(255,255,255,.6)}
.toc button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:16px 4px;border:0;border-bottom:1.5px solid var(--line);background:none;font-weight:700;font-size:clamp(17px,2.4vw,21px);cursor:pointer;color:var(--ink);text-align:left}
.toc button:hover{background:rgba(120,100,60,.1)}
.toc em{font-size:13px;opacity:.55;font-style:normal;font-weight:400}
.back{border:0;background:none;color:inherit;font-weight:700;font-size:13px;cursor:pointer;opacity:.65;margin-bottom:12px;padding:0}
.q{font-size:clamp(15px,1.9vw,18px);line-height:1.75;margin:8px 0}.qn{font-weight:700;font-size:1.3em;margin-right:4px}
.fig{background:#fff;border:1.5px solid var(--line);border-radius:6px;display:block;margin:12px auto;max-width:100%}
.opw{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin:14px 0}
.op{background:none;border:0;border-bottom:1px dashed rgba(43,37,32,.3);text-align:left;padding:9px 4px;font-size:clamp(15px,1.8vw,18px);color:var(--ink);cursor:pointer}
.op b{display:inline-block;width:1.7em;height:1.7em;line-height:1.55em;text-align:center;border:1.5px solid var(--ink);border-radius:50%;margin-right:10px;font-size:.85em}
.op:hover{background:rgba(120,100,60,.12)}
.op.ok{background:#dcf1df}.op.ok b{background:#2e7d45;border-color:#2e7d45;color:#fff}
.op.no{background:#f9dcdc;text-decoration:line-through}.op.no b{background:#b53b3b;border-color:#b53b3b;color:#fff}
.sol{display:none;margin-top:12px;padding:10px 14px;background:rgba(42,117,96,.1);border-left:4px solid var(--ma);line-height:1.7;font-size:14px}.sol.open{display:block}
.big{font-size:70px;text-align:center;margin:40px 0}.big span{color:var(--ma)}
.pp p{line-height:1.85;margin-bottom:12px}
mark{background:linear-gradient(transparent 52%,var(--hl) 52% 92%,transparent 92%);color:inherit;padding:0 2px;border-radius:3px;transform:rotate(-.4deg)}
.kw{margin-top:22px;padding:12px 14px;border:2px dashed rgba(154,64,70,.5);border-radius:10px;line-height:1.6}
@media(max-width:720px){.pp{padding:18px 14px;font-size:13px}.opw{grid-template-columns:1fr}#bk.sc{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="desk"><svg class="sta" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<g transform="rotate(-18 200 560)"><rect x="90" y="540" width="250" height="14" rx="3" fill="#f2c94c"/><polygon points="340,540 372,547 340,554" fill="#f0d9b5"/><polygon points="364,544.5 372,547 364,549.5" fill="#333"/><rect x="90" y="540" width="22" height="14" rx="3" fill="#d9777a"/></g>
<g transform="rotate(12 760 600)"><rect x="620" y="590" width="240" height="13" rx="6" fill="#2b3a55"/><rect x="620" y="590" width="60" height="13" rx="6" fill="#c9ced8"/><rect x="858" y="594" width="14" height="5" fill="#222"/></g>
<g transform="rotate(-6 880 140)"><rect x="740" y="120" width="260" height="34" rx="3" fill="#e9dfbf" stroke="#b9ab80"/><g stroke="#7a6c44" stroke-width="2"><path d="M770 120v14M800 120v10M830 120v14M860 120v10M890 120v14M920 120v10M950 120v14"/></g></g>
<g transform="rotate(20 120 150)"><rect x="60" y="130" width="70" height="36" rx="6" fill="#f4f1ea"/><rect x="60" y="130" width="28" height="36" rx="6" fill="#4a90c2"/></g>
<g transform="rotate(-30 450 650)"><rect x="380" y="640" width="150" height="12" rx="6" fill="#4caf7a"/><polygon points="530,640 552,646 530,652" fill="#f0d9b5"/></g>
<circle cx="900" cy="470" r="22" fill="#d7d9de" stroke="#999"/><circle cx="900" cy="470" r="9" fill="#6a452f"/>
</svg>
<div id="clk" aria-label="탁상시계"><div class="top"><i></i><i></i></div><div class="face"><div class="scr"><b id="tm">--:--:--</b><span id="dt"></span></div></div><div class="lg"><i></i><i></i></div></div>
<div id="shelf">
<button class="bk" data-s="en" style="--c1:#2d5a94;--c2:#5b8cc9;--c3:#1d3e69" aria-label="영어책 열기"><span>영어<i>English</i></span></button>
<button class="bk" data-s="ma" style="--c1:#2a7560;--c2:#55a98e;--c3:#1b4c3e" aria-label="수학책 열기"><span>수학<i>Math</i></span></button>
<button class="bk" data-s="sc" style="--c1:#9a4046;--c2:#cc7075;--c3:#672b30" aria-label="과학책 열기"><span>과학<i>Science</i></span></button>
</div></div>
<div id="st"><div id="bk"><div class="cv"></div><div class="pgs"><div id="L" class="pp l"></div><div id="R" class="pp r"></div></div><button id="x" aria-label="책 덮기">✕</button><button id="pv" class="nv" aria-label="이전">◀</button><button id="nx" class="nv" aria-label="다음">▶</button></div></div>
<script>
const $=s=>document.querySelector(s),st=$('#st'),bk=$('#bk'),L=$('#L'),R=$('#R');
const NAME={en:'영어',ma:'수학',sc:'과학'};
let cur=null,page=null,P=[],k=0,busy=0,AC,score=0;
const kst=()=>new Date(Date.now()+324e5),day=()=>Math.floor((Date.now()+324e5)/864e5),hour=()=>Math.floor(Date.now()/36e5);
const ac=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();
function swish(){try{const c=ac(),n=c.sampleRate*.4|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n)**1.5;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.value=2200;g.gain.value=.3;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start()}catch(e){}}
function note(f,s,d,v,ty){const c=ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+s);g.gain.exponentialRampToValueAtTime(v,t+s+.02);g.gain.exponentialRampToValueAtTime(.001,t+s+d);o.connect(g).connect(c.destination);o.start(t+s);o.stop(t+s+d+.05)}
function ding(){try{note(880,0,1.3,.25);note(1320,0,1.3,.12)}catch(e){}}
function fan(){try{[[523,0,.14],[659,.14,.14],[784,.28,.14],[1047,.44,.8],[784,.44,.8],[659,.44,.8]].forEach(a=>note(a[0],a[1],a[2],.2,'triangle'))}catch(e){}}
function speak(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const sp=j=>[P[2*j],P[2*j+1]].map(p=>typeof p==='function'?p():p||'');
function nav(){$('#pv').style.visibility=k>0?'visible':'hidden';$('#nx').style.visibility=(P[2*k+2]||P[2*k+3])?'visible':'hidden'}
function show(){const a=sp(k);L.innerHTML=a[0];R.innerHTML=a[1];nav()}
function store(){if(typeof P[2*k]!=='function')P[2*k]=L.innerHTML;if(typeof P[2*k+1]!=='function')P[2*k+1]=R.innerHTML}
function turn(d){const j=k+d;if(busy||j<0||!(P[2*j]||P[2*j+1]))return;busy=1;store();const o=sp(k),n=sp(j),lf=document.createElement('div');lf.className='leaf '+(d>0?'f':'b');
lf.innerHTML=d>0?`<div class="pp r">${o[1]}</div><div class="pp l bk2">${n[0]}</div>`:`<div class="pp l">${o[0]}</div><div class="pp r bk2">${n[1]}</div>`;
if(d>0)R.innerHTML=n[1];else L.innerHTML=n[0];bk.appendChild(lf);swish();
setTimeout(()=>{lf.remove();k=j;show();busy=0},820)}
function riffle(n,rev,cb){busy=1;L.innerHTML=R.innerHTML='';$('#pv').style.visibility=$('#nx').style.visibility='hidden';
for(let i=0;i<n;i++){const lf=document.createElement('div');lf.className='leaf '+(rev?'b':'f');lf.style.animationDelay=i*.1+'s';lf.style.setProperty('--d','.7s');lf.innerHTML=`<div class="pp ${rev?'l':'r'}"></div><div class="pp ${rev?'r':'l'} bk2"></div>`;bk.appendChild(lf);setTimeout(swish,i*100);setTimeout(()=>lf.remove(),i*100+720)}
setTimeout(()=>{busy=0;cb()},n*100+740)}
function open(s){cur=s;bk.className=s;L.innerHTML=R.innerHTML='';nav();$('#pv').style.visibility=$('#nx').style.visibility='hidden';st.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>st.classList.add('vis')));
setTimeout(()=>riffle(7,false,()=>s==='en'?english():toc(s)),850)}
function close(){st.classList.remove('vis');setTimeout(()=>{st.classList.remove('on');L.innerHTML=R.innerHTML='';cur=null;busy=0},500)}
document.querySelectorAll('.bk').forEach(b=>b.onclick=()=>open(b.dataset.s));
addEventListener('keydown',e=>{if(!cur)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});
bk.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.classList.contains('op'))answer(t);else if(t.dataset.t)go(t.dataset.t);else if(t.classList.contains('snd'))speak(t.dataset.w);else if(t.classList.contains('back')){if(!busy)toc(cur,true)}else if(t.id==='pv')turn(-1);else if(t.id==='nx')turn(1);else if(t.id==='x')close()});
function answer(t){const sol=t.closest('.pp').querySelector('.sol');if(sol.classList.contains('open'))return;sol.classList.add('open');
t.closest('.pp').querySelectorAll('.op').forEach(x=>{if(x.dataset.v==x.dataset.a)x.classList.add('ok')});
if(t.dataset.v==t.dataset.a){score++;fan()}else t.classList.add('no')}

const W=`ubiquitous|juːˈbɪkwɪtəs|형용사|어디에나 있는, 아주 흔한|Smartphones are ubiquitous these days.|요즘은 스마트폰이 어디에나 있다.
reluctant|rɪˈlʌktənt|형용사|꺼리는, 마지못한|She was reluctant to speak in public.|그녀는 사람들 앞에서 말하기를 꺼렸다.
diligent|ˈdɪlɪdʒənt|형용사|근면한, 성실한|He is a diligent student who never skips homework.|그는 숙제를 거르지 않는 성실한 학생이다.
ambiguous|æmˈbɪɡjuəs|형용사|모호한, 애매한|The ending of the movie was ambiguous.|그 영화의 결말은 모호했다.
inevitable|ɪnˈevɪtəbl|형용사|피할 수 없는, 필연적인|Change is inevitable in life.|삶에서 변화는 피할 수 없다.
resilient|rɪˈzɪliənt|형용사|회복력 있는, 탄력 있는|Children are often more resilient than adults.|아이들은 어른보다 회복력이 강한 경우가 많다.
scarce|skeərs|형용사|부족한, 드문|Fresh water is scarce in the desert.|사막에서는 깨끗한 물이 부족하다.
vulnerable|ˈvʌlnərəbl|형용사|취약한, 상처받기 쉬운|Young plants are vulnerable to frost.|어린 식물은 서리에 취약하다.
contemplate|ˈkɒntəmpleɪt|동사|곰곰이 생각하다|He contemplated his future by the window.|그는 창가에서 자신의 미래를 곰곰이 생각했다.
abundant|əˈbʌndənt|형용사|풍부한, 많은|The island has abundant wildlife.|그 섬에는 야생 동물이 풍부하다.
coherent|kəʊˈhɪərənt|형용사|일관성 있는, 논리 정연한|Write a coherent paragraph with a clear topic.|분명한 주제를 가진 논리 정연한 문단을 써라.
thrive|θraɪv|동사|번창하다, 잘 자라다|Cactus plants thrive in dry places.|선인장은 건조한 곳에서 잘 자란다.`.split('\n').map(l=>l.split('|'));


function english(){const b=day()*3,w=[0,1,2].map(i=>W[(b+i)%W.length]),d=kst();
const wp=(x,i)=>`<div class="no">오늘의 영단어 ${i+1} / 3</div><div class="wd">${x[0]}</div><div class="pr"><span>/${x[1]}/</span><button class="snd" data-w="${x[0]}">🔊 발음 듣기</button></div><div class="ent"><b>${x[2]}</b> ${x[3]}<div class="ex">${x[4]}<br><small>${x[5]}</small></div></div>`;
P=['<div id="intro">오늘의 영단어</div>',wp(w[0],0),wp(w[1],1),wp(w[2],2)];k=0;busy=1;L.innerHTML=P[0];R.innerHTML='';nav();

const SCI={phy:[['뉴턴의 만유인력','1687년 뉴턴은 『프린키피아』에서 모든 물체가 서로 끌어당긴다는 만유인력의 법칙을 발표했습니다. 사과를 땅으로 떨어뜨리는 힘과 달이 지구 둘레를 도는 힘이 같은 힘이라는 생각이었죠. 두 물체 사이의 힘은 질량의 곱에 비례하고 거리의 제곱에 반비례합니다.','<circle cx="100" cy="45" r="16" fill="#4a86c5"/><ellipse cx="100" cy="45" rx="80" ry="30" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><circle cx="178" cy="45" r="6" fill="#e0b84a"/>'],['패러데이의 전자기 유도','1831년 패러데이는 코일 근처에서 자석을 움직이면 코일에 전류가 흐른다는 사실을 발견했습니다. 자기장이 변할 때 전기가 만들어진다는 이 원리는 오늘날 발전소의 발전기와 변압기의 바탕이 되었습니다.','<rect x="70" y="30" width="30" height="30" fill="#c0392b"/><rect x="100" y="30" width="30" height="30" fill="#2f4d7a"/><path d="M140 45c10-18 20 18 30 0s20 18 30 0" fill="none" stroke="#e0b84a" stroke-width="3"/>'],['갈릴레이의 낙하 실험','갈릴레이는 무거운 물체가 더 빨리 떨어진다는 아리스토텔레스의 생각을 실험으로 반박했습니다. 공기 저항이 없다면 무게와 상관없이 모든 물체가 같은 가속도로 떨어진다는 것을 보였고, 근대 물리학의 길을 열었습니다.','<path d="M20 78H180L70 70" fill="none" stroke="#8a6a3a" stroke-width="4"/><circle cx="60" cy="22" r="8" fill="#c0392b"/><circle cx="60" cy="52" r="8" fill="#c0392b" opacity=".4"/><circle cx="130" cy="30" r="12" fill="#2f4d7a"/>']],

bio:`훅의 세포 발견|cell|1665년 훅은 현미경으로 코르크를 관찰하다 벌집 같은 작은 방들을 보고 '세포'라는 이름을 붙였습니다.

che:`보일의 법칙|syr|1662년 보일은 온도가 일정할 때 기체의 부피가 압력에 반비례한다는 것을 밝혔습니다.

ast:`갈릴레이의 망원경 관측|tele|1609년 갈릴레이는 망원경으로 목성의 위성, 달의 크레이터, 금성의 위상 변화를 관측해 지동설을 뒷받침했습니다.

핼리 혜성의 예측|comet|핼리는 1531, 1607, 1682년의 혜성이 같은 천체라고 보고 1758년 재출현을 예측했습니다. 그 혜성에 그의 이름이 붙었습니다.

const EXT={phy:`만유인력,질량의 곱|뉴턴 덕분에 사람들은 밀물과 썰물, 행성의 궤도, 인공위성의 움직임을 모두 같은 식으로 계산할 수 있게 되었습니다. 지금도 우주선의 경로를 짤 때 이 원리를 바탕으로 합니다. 하늘의 법칙과 땅의 법칙이 하나라는 생각은 당시로서는 아주 놀라운 것이었습니다.
전자기 유도,발전기|패러데이의 전자기 유도 발견 덕분에 움직이는 자석으로 전기를 만드는 발전기가 가능해졌습니다. 물이나 바람, 증기로 터빈을 돌리면 코일 속 자기장이 변하면서 전류가 흐릅니다. 오늘날 우리가 쓰는 전기의 대부분이 이렇게 만들어집니다.
갈릴레이,같은 가속도|갈릴레이는 경사면에 공을 굴리는 실험으로 낙하하는 물체가 일정하게 빨라진다는 것을 확인했습니다. 훗날 달에서 우주비행사가 깃털과 망치를 동시에 떨어뜨렸더니 정말 같이 떨어졌습니다. 생각만으로 따지지 않고 실험으로 확인하는 태도가 근대 과학의 출발이었습니다.
관성,F=ma|운동 법칙 덕분에 자동차가 급정거할 때 몸이 앞으로 쏠리는 이유와 로켓이 날아오르는 이유를 설명할 수 있습니다. 같은 힘으로 밀어도 무거운 물체는 가속도가 작게 나타납니다. 이 세 가지 법칙은 기계를 설계하는 모든 공학의 기초입니다.
